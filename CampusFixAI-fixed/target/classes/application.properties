spring.application.name=CampusFix AI
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/campusfixdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# To use MySQL, comment the H2 datasource settings above and uncomment:
# spring.datasource.url=jdbc:mysql://localhost:3306/campusfix
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update

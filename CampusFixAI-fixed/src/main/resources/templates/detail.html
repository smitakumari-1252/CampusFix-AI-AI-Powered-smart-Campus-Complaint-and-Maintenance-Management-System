<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complaint Details | CampusFix AI</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="form-page"><div class="form-top"><a class="brand dark-brand" href="/"><span class="brand-mark">C</span><span>CampusFix<span class="brand-ai"> AI</span><small>SMART CAMPUS CARE</small></span></a><a class="back-link" href="/">← Dashboard</a></div><main class="form-container detail-container"><div class="form-heading"><div class="eyebrow">COMPLAINT / <span th:text="'#CF-' + ${complaint.id}"></span></div><h1 th:text="${complaint.title}">Complaint title</h1><p>Review the report details and update its progress.</p></div><div class="form-card detail-card"><div class="detail-grid"><div><small>REPORTED BY</small><b th:text="${complaint.studentName}"></b><span th:text="${complaint.studentEmail}"></span></div><div><small>LOCATION</small><b th:text="${complaint.location}"></b></div><div><small>CATEGORY</small><b th:text="${complaint.category}"></b></div><div><small>PRIORITY</small><b th:text="${complaint.priority}"></b></div><div><small>ASSIGNED DEPARTMENT</small><b th:text="${complaint.department}"></b></div><div><small>DATE REPORTED</small><b th:text="${complaint.formattedDate}"></b></div></div><hr><small class="description-label">DESCRIPTION</small><p class="description-text" th:text="${complaint.description}"></p><div class="current-status"><span>Current status</span><b th:text="${complaint.status}"></b></div><form th:action="@{/complaints/{id}/status(id=${complaint.id})}" method="post" class="status-form"><label>Update complaint status<select name="status"><option>Submitted</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select></label><button class="primary-btn" type="submit">Save status →</button></form></div></main></body></html>
